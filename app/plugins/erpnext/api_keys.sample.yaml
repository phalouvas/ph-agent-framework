# Sample API keys configuration.
# Copy this to data/api_keys.yaml and edit.
#
# ── How the flow works ───────────────────────────────────────────────
#
#   Open WebUI  ──POST /tools/erpnext_get_doc──▶  PH Agent Framework  ──GET /api/resource/...──▶  ERPNext
#                  X-API-Key: sk-abc123               (this server)        token erp-key:erp-secret
#
#   1. An admin registers this tool server in Open WebUI (Admin Settings → Tools)
#      and provides an API key from this file, e.g. "sk-abc123".
#   2. When ANY Open WebUI user's conversation triggers a tool, Open WebUI
#      sends that same API key (sk-abc123) in the X-API-Key header.
#   3. This server hashes the key, looks it up here, and reads the tenant block.
#   4. The tenant.url / tenant.api_key / tenant.api_secret are then used by
#      this server to talk to ERPNext on behalf of the original user.
#
#   In short:
#     key           = the secret Open WebUI uses → this server
#     tenant.api_*  = the secret this server uses → ERPNext
#
# ── Fields ───────────────────────────────────────────────────────────
#
#   key           The API key Open WebUI sends when calling this server.
#                 Acts as the password for the tool server connection.
#                 Generated by you — use a long random string.
#
#   name          A label for this key (appears in server logs).
#                 Does NOT need to match any Open WebUI username.
#
#   tenant        Optional. ERPNext instance to route requests to.
#     url         Base URL of the ERPNext instance (e.g. https://erp.example.com)
#     api_key     ERPNext API key — generated inside ERPNext by an admin:
#                   ERPNext → User → API Access → Add API Key
#     api_secret  ERPNext API secret — shown once when the key is created.
#                 Together api_key + api_secret form the "token" auth for ERPNext.
#
#   If tenant is omitted, the key can still call system/utility tools
#   (ping, random_number, text_transform, etc.) but not ERPNext tools.

api_keys:
  - key: sk-abc123
    name: acme-corp-connection
    tenant:
      url: https://erp.example.com
      api_key: erp-api-key
      api_secret: erp-api-secret

  - key: sk-xyz789
    name: readonly-user
    # No tenant — can use system/utility tools but not ERPNext tools
