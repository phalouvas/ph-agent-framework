# Sample API keys configuration.
# Copy this to data/api_keys.yaml and edit.
#
# ── How the flow works ───────────────────────────────────────────────
#
#   Open WebUI  ──POST /tools/erpnext_get_doc──▶  PH Agent Framework  ──GET /api/resource/...──▶  ERPNext
#                  X-API-Key: sk-abc123               (this server)        token erp-key:erp-secret
#                  X-OpenWebUI-User-Email: alice@...
#
#   1. An admin registers this tool server in Open WebUI (Admin Settings → Tools)
#      and provides an API key from this file, e.g. "sk-abc123".
#   2. When ANY Open WebUI user's conversation triggers a tool, Open WebUI
#      sends the shared API key PLUS the user's email in X-OpenWebUI-User-Email.
#      (Requires ENABLE_FORWARD_USER_INFO_HEADERS=true on the Open WebUI container.)
#   3. This server hashes the API key to look up the key block, then checks the
#      users list for a matching email to find the per-user ERPNext tenant.
#      If no match, it falls back to the key-level default tenant.
#   4. The tenant.url / tenant.api_key / tenant.api_secret are then used by
#      this server to talk to ERPNext on behalf of the original user.
#
#   In short:
#     key              = the shared secret Open WebUI uses → this server
#     users[].email    = which Open WebUI user this tenant applies to
#     users[].tenant   = the ERPNext credentials for that specific user
#     tenant           = fallback ERPNext credentials (used when no per-user match)
#
# ── Fields ───────────────────────────────────────────────────────────
#
#   key               The API key Open WebUI sends when calling this server.
#                     Generated by you — use a long random string.
#
#   name              A label for this key (appears in server logs).
#
#   tenant            (Optional) Default ERPNext tenant — used as fallback when
#                     no per-user match is found, or when user email is unavailable.
#     url             Base URL of the ERPNext instance
#     api_key         ERPNext API key (ERPNext → User → API Access → Add API Key)
#     api_secret      ERPNext API secret (shown once when the key is created)
#
#   users             (Optional) Per-user tenant overrides.
#     - email         Open WebUI user email to match against.
#                     Must match exactly (case-insensitive).
#       tenant        ERPNext credentials for this specific user.
#
#   Resolution order: user tenant (if email matches) → key-level tenant → None

api_keys:
  - key: sk-abc123
    name: production-key
    tenant:
      url: https://erp.example.com
      api_key: default-erp-key
      api_secret: default-erp-secret
    users:
      - email: alice@example.com
        tenant:
          url: https://erp-tenant-a.example.com
          api_key: alice-erp-key
          api_secret: alice-erp-secret
      - email: bob@example.com
        tenant:
          url: https://erp-tenant-b.example.com
          api_key: bob-erp-key
          api_secret: bob-erp-secret

  - key: sk-xyz789
    name: readonly-key
    # No tenant — can use system/utility tools but not ERPNext tools
