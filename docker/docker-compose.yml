services:
  ph-agent-framework:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../config:/app/config:ro
      - ph_data:/app/data
    environment:
      - INITIAL_API_KEYS=${INITIAL_API_KEYS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped

volumes:
  ph_data:
